          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectUuid:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: UUID проекта
      schema:
        type: string
        format: uuid
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusId:
      name: statusId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubsystemId:
      name: subsystemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskKey:
      name: key
      in: path
      required: true
      description: Ключ задачи вида PROJ-123 (без учёта регистра)
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9]{1,5}-[0-9]+$'
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UrlId:
      name: urlId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorklogId:
      name: worklogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Неверный формат запроса (code bad_request)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Ошибка сервера (code internal_error, в error.requestId - идентификатор запроса)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Нет сессии (code unauthenticated)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Неверный логин или пароль (code invalid_credentials)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Нет права (code forbidden, account_deactivated, password_change_required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено (code not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationInvalid:
      description: Приглашение недействительно (code invitation_invalid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >
        Конфликт состояния (code username_taken, telegram_already_linked, last_login_method,
        telegram_not_linked, last_owner, user_deactivated, cannot_reissue_self, cannot_deactivate_self,
        project_key_taken, already_member, already_owner, owner_role_locked,
        cannot_change_self, cannot_remove_self,
        name_taken, move_to_required, last_done_status, last_board, board_would_be_empty,
        task_archived, parent_archived, task_already_archived, task_not_archived, link_exists, link_cycle, stale_position)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Не прошла валидация (code validation_failed, поле fields)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyAttempts:
      description: Превышен лимит попыток (code too_many_attempts)
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorCode:
      type: string
      description: Стабильный код ошибки (snake_case); HTTP-статус и состав details по кодам - в docs/backend/00 раздел 3
      enum:
        - unauthenticated
        - invalid_credentials
        - forbidden
        - account_deactivated
        - password_change_required
        - not_found
        - invitation_invalid
        - bad_request
        - validation_failed
        - too_many_attempts
        - internal_error
        - username_taken
        - telegram_already_linked
        - last_login_method
        - telegram_not_linked
        - last_owner
        - user_deactivated
        - cannot_reissue_self
        - cannot_deactivate_self
        - project_key_taken
        - already_member
        - already_owner
        - owner_role_locked
        - cannot_change_self
        - cannot_remove_self
        - name_taken
        - move_to_required
        - last_done_status
        - last_board
        - board_would_be_empty
        - task_archived
        - parent_archived
        - task_already_archived
        - task_not_archived
        - link_exists
        - link_cycle
        - stale_position
    FieldErrorReason:
      type: string
      description: Причина ошибки поля в error.fields (при validation_failed и name_taken)
      enum:
        - required
        - invalid
        - too_long
        - too_many
        - taken
        - immutable
        - locked
        - mismatch
        - empty
        - duplicate
        - limit
        - not_found
        - not_active
        - not_member
        - not_allowed
        - reason_required
        - archived
        - same_task
        - use_move
        - in_future
        - invalid_order
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Текст на русском
            requestId:
              type: string
              description: Только в теле 5xx; равен заголовку X-Request-Id ответа
            fields:
              type: object
              description: Только validation_failed и name_taken; ключ - имя поля запроса
              additionalProperties:
                $ref: '#/components/schemas/FieldErrorReason'
            details:
              type: object
              description: Данные для показа пользователю; состав зависит от code (tag - уже существующий тег при name_taken у тега)
              properties:
                projects:
                  type: array
                  description: last_owner - названия проектов
                  items:
                    type: string
                boards:
                  type: array
                  description: board_would_be_empty - названия досок
                  items:
                    type: string
                userIds:
                  type: array
                  description: already_member - UUID пользователей, уже состоящих в проекте
                  items:
                    type: string
                    format: uuid
                tag:
                  $ref: '#/components/schemas/Tag'
    UserStatus:
      type: string
      enum: [invited, active, deactivated]
    TelegramInfo:
      type: object
      required: [linked, username]
      properties:
        linked:
          type: boolean
        username:
          type: string
          nullable: true
    User:
      type: object
      required:
        [id, name, username, status, hasPassword, telegram, notifyTelegram]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: string
          nullable: true
          pattern: '^[a-z0-9_]{3,32}$'
        status:
          $ref: '#/components/schemas/UserStatus'
        hasPassword:
          type: boolean
        telegram:
          $ref: '#/components/schemas/TelegramInfo'
        notifyTelegram:
          type: boolean
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [user, permissions, mustChangePassword]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          description: Глобальные ключи разрешений (только у системного администратора)
          items:
            $ref: '#/components/schemas/GlobalPermission'
        mustChangePassword:
          type: boolean
    GlobalPermission:
      type: string
      description: Глобальные ключи системного администратора (GET /auth/me)
      enum:
        - user-list
        - user-invite
        - user-reissue-access
        - user-deactivate
        - project-create
        - project-list-all
        - project-change-owner
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 128
    TelegramStartResponse:
      type: object
      required: [token, deepLink, expiresAt]
      properties:
        token:
          type: string
        deepLink:
          type: string
          example: https://t.me/example_bot?start=TOKEN
        expiresAt:
          type: string
          format: date-time
    TelegramStatusRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Токен из ответа start
    TelegramStatusResponse:
      type: object
      required: [status, user, telegramUsername]
      properties:
        status:
          type: string
          enum:
            [
              waiting,
              expired,
              confirmed,
              not_linked,
              deactivated,
              already_linked,
            ]
        user:
          type: object
          nullable: true
          description: Только для целей login и link при confirmed, иначе null
          allOf:
            - $ref: '#/components/schemas/User'
        telegramUsername:
          type: string
          nullable: true
          description: Только для цели invite при confirmed (null, если у Telegram-аккаунта нет username), иначе null
    InvitationInfo:
      type: object
      required: [name, kind, username]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [new, reissue]
          description: >
            new - у пользователя ещё нет логина, при принятии username обязателен (так бывает и после "Новой ссылки" для приглашённого, который не успел выбрать логин);
            reissue - логин уже есть, он возвращается в username и при принятии не передаётся
        username:
          type: string
          nullable: true
