      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/HistoryKind'
        field:
          type: string
          nullable: true
          description: HistoryField для field_changed и unassigned_on_member_removal (assignee или reviewer); LinkType для link_added и link_removed (тип связи с точки зрения задачи)
          oneOf:
            - $ref: '#/components/schemas/HistoryField'
            - $ref: '#/components/schemas/LinkType'
        oldValue:
          type: object
          allOf:
            - $ref: '#/components/schemas/HistoryValue'
          nullable: true
        newValue:
          type: object
          allOf:
            - $ref: '#/components/schemas/HistoryValue'
          nullable: true
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserRef'
    HistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
    LinkTypeInput:
      type: string
      enum: [blocks, blocked_by]
    LinkType:
      type: string
      description: С точки зрения читаемой задачи
      enum: [blocks, blocked_by]
    LinkedTask:
      type: object
      required: [id, key, title, status, archived]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/StatusRef'
        archived:
          type: boolean
    TaskLink:
      type: object
      required: [id, type, task]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/LinkType'
        task:
          $ref: '#/components/schemas/LinkedTask'
    CreateLinkRequest:
      type: object
      required: [type, targetTaskId]
      properties:
        type:
          $ref: '#/components/schemas/LinkTypeInput'
        targetTaskId:
          type: string
          format: uuid
    LinkResponse:
      type: object
      required: [link]
      properties:
        link:
          $ref: '#/components/schemas/TaskLink'
    TaskUrl:
      type: object
      required: [id, url, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          maxLength: 2000
          pattern: '^https?://'
        title:
          type: string
          nullable: true
          maxLength: 100
        createdAt:
          type: string
          format: date-time
    CreateUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2000
          pattern: '^https?://'
        title:
          type: string
          nullable: true
          maxLength: 100
    TaskUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          $ref: '#/components/schemas/TaskUrl'
    TaskSearchItem:
      type: object
      required: [id, key, type, title, status]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        type:
          $ref: '#/components/schemas/TaskType'
        title:
          type: string
        status:
          $ref: '#/components/schemas/StatusRef'
    TaskSearchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TaskSearchItem'
    BoardCard:
      type: object
      required:
        [
          id,
          key,
          type,
          title,
          priority,
          dueDate,
          isOverdue,
          assignee,
          tags,
          parent,
          blocked,
          rank,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        type:
          $ref: '#/components/schemas/TaskType'
        title:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
          nullable: true
        isOverdue:
          type: boolean
        assignee:
          type: object
          allOf:
            - $ref: '#/components/schemas/UserRef'
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        parent:
          type: object
          nullable: true
          required: [id, key]
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
        blocked:
          type: boolean
        rank:
          type: string
    BoardColumnCards:
      type: object
      required: [statusId, requiresReason, count, cards]
      properties:
        statusId:
          type: string
          format: uuid
        requiresReason:
          type: boolean
          description: Как у статуса колонки - при переносе в неё нужна причина; диалог причины не требует отдельного запроса статусов
        count:
          type: integer
          description: Число подходящих карточек с учётом фильтров и окна Done
        cards:
          type: array
          items:
            $ref: '#/components/schemas/BoardCard'
    BoardCards:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumnCards'
    MoveTaskRequest:
      type: object
      required: [statusId]
      properties:
        statusId:
          type: string
          format: uuid
        prevId:
          type: string
          format: uuid
          nullable: true
          description: Сосед, которого пользователь видит непосредственно выше места, куда бросили карточку. null равен отсутствию поля. Неизвестный UUID - 409 stale_position
        nextId:
          type: string
          format: uuid
          nullable: true
          description: Сосед, которого пользователь видит непосредственно ниже места, куда бросили карточку. null равен отсутствию поля. Неизвестный UUID - 409 stale_position
        reason:
          type: string
          maxLength: 2000
          description: Причина; обязательна при смене статуса на статус с requiresReason. Если статус не меняется - игнорируется (комментарий не создаётся)
    CommentKind:
      type: string
      enum: [comment, status_reason]
    Comment:
      type: object
      required: [id, taskId, kind, body, mentions, author, createdAt, editedAt]
      properties:
        id:
          type: string
          format: uuid
