        comment:
          type: string
          nullable: true
          maxLength: 2000
    UpdateWorklogRequest:
      type: object
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 1440
        date:
          type: string
          format: date
        comment:
          type: string
          nullable: true
          maxLength: 2000
    NotificationType:
      type: string
      enum:
        [
          assigned,
          reviewer_assigned,
          mentioned,
          commented,
          status_changed,
          assignee_changed,
          reviewer_changed,
        ]
    NotificationTask:
      type: object
      required: [id, key, title, projectId, projectKey]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        projectId:
          type: string
          format: uuid
        projectKey:
          type: string
    NotificationDetails:
      type: object
      description: >
        Всегда объект со всеми пятью полями. status_changed - from, to, reason; assignee_changed и reviewer_changed - from и to (null - не назначен);
        commented и mentioned - commentId и excerpt; assigned и reviewer_assigned - все поля null. Поля, не относящиеся к типу, равны null.
      required: [from, to, reason, commentId, excerpt]
      properties:
        from:
          type: object
          allOf:
            - $ref: '#/components/schemas/HistoryValue'
          nullable: true
        to:
          type: object
          allOf:
            - $ref: '#/components/schemas/HistoryValue'
          nullable: true
        reason:
          type: string
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
        excerpt:
          type: string
          nullable: true
          maxLength: 200
    NotificationItem:
      type: object
      required: [id, type, actor, task, details, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        actor:
          $ref: '#/components/schemas/UserRef'
        task:
          $ref: '#/components/schemas/NotificationTask'
        details:
          $ref: '#/components/schemas/NotificationDetails'
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationPage:
      type: object
      required: [items, hasMore, nextCursor]
      properties:
        items:
          type: array
          description: От новых к старым
          items:
            $ref: '#/components/schemas/NotificationItem'
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
          description: Курсор последнего показанного уведомления для следующего запроса; null, если hasMore = false
    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
