    AcceptInvitationRequest:
      type: object
      description: Передайте либо password, либо telegramToken
      properties:
        username:
          type: string
          pattern: '^[a-z0-9_]{3,32}$'
          description: >
            Обязателен для kind=new (в обоих способах), не передаётся для reissue.
            Только в нижнем регистре, ^[a-z0-9_]{3,32}$: заглавные сервер не приводит, а отклоняет (422 fields.username = invalid). Приведение к нижнему регистру - на фронте
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Не короче 8 символов, хотя бы одна буква и одна цифра
        telegramToken:
          type: string
      oneOf:
        - required: [password]
        - required: [telegramToken]
