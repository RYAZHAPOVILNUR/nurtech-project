openapi: 3.0.3
info:
  title: Task manager API
  version: 0.7.0
  description: >
    Контракт API учебного таск-менеджера. Файл растёт пакетами ТЗ (docs/backend).
    Сейчас: пакет 1 (вход, приглашения, сессия, профиль, администрирование пользователей)
    пакет 2 (проекты, участники, права) и пакет 3 (статусы, доски, направления, теги), пакет 4 (задачи) пакет 5 (связи, ссылки, поиск, список) пакет 6 (карточки досок, перенос) пакет 7 (комментарии, списания, подписки) и пакет 8 (уведомления, webhook бота). Параметр projectId — UUID проекта (ключ в путях не используется).
    У каждой ручки указано x-permission (ключ из docs/13), none (достаточно сессии) или x-public.
    Источник истины - этот файл. Любое изменение контракта - это PR с повышением minor в info.version и строкой в CHANGELOG.md рядом; ломающие изменения - только с согласия ментора.
servers:
  - url: /api
tags:
  - name: Session
  - name: Telegram
  - name: Invitations
  - name: Profile
  - name: Admin users
  - name: Admin projects
  - name: Projects
  - name: Members
  - name: Statuses
  - name: Boards
  - name: Subsystems
  - name: Tags
  - name: Tasks
  - name: Links
  - name: Comments
  - name: Worklogs
  - name: Watches
  - name: Notifications
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Session]
      summary: Вход по логину и паролю
      description: 'Неверный логин или пароль, а также тело, не прошедшее проверку длины, - 401 invalid_credentials (одинаковый ответ). Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана (Set-Cookie sid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags: [Session]
      summary: Выход
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '204':
          description: Сессия отозвана
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getMe
      tags: [Session]
      summary: Текущий пользователь и глобальные права
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/telegram/start:
    post:
      operationId: startTelegramLogin
      tags: [Telegram]
      summary: Начать вход через Telegram
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/telegram/status:
    post:
      operationId: pollTelegramStatus
      tags: [Telegram]
      summary: Статус Telegram-запроса (опрос раз в 2 секунды)
      description: >
        Токен передаётся в теле, а не в адресе: ручка меняет состояние и не должна попадать токеном в журналы.
        Для цели login при confirmed в ответе устанавливается сессия (Set-Cookie sid), запрос закрывается.
        Для цели invite при confirmed возвращается telegramUsername; запрос не закрывается, его закрывает acceptInvitation.
        Для цели link ответ доступен только сессии, создавшей запрос (иначе 404), при confirmed Telegram привязывается и запрос закрывается.
        Конечные статусы expired, not_linked, deactivated, already_linked закрывают запрос после выдачи.
        Неизвестный или закрытый токен: 404. Публичная ручка, сессия не нужна.
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [Invitations]
      summary: Данные приглашения
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/username-available:
    get:
      operationId: checkUsernameAvailable
      tags: [Invitations]
      summary: Проверка логина на занятость
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/telegram/start:
    post:
      operationId: startInvitationTelegram
      tags: [Invitations, Telegram]
      summary: Начать подтверждение Telegram для приглашения
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Принять приглашение
      description: >
        Либо пароль, либо telegramToken подтверждённого запроса цели invite этого же приглашения. Для kind=new username обязателен в обоих способах
        (из telegramUsername логин не берётся: фронт подставляет его в поле, приведя к нижнему регистру); для kind=reissue username не передаётся (422 fields.username = not_allowed).
        Чужой, неподтверждённый, просроченный и уже использованный токен Telegram, а также приглашение, отозванное деактивацией пользователя, - 404 invitation_invalid.
        Приглашение одноразовое: из двух одновременных запросов успешен один, второй получает 404 invitation_invalid.
        Успех: 200 MeResponse (как GET /auth/me) и сессия (Set-Cookie sid).
        Публичная ручка, сессия не нужна.
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Аккаунт активен, сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile:
    patch:
      operationId: updateProfile
      tags: [Profile]
      summary: Изменить имя
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile/password:
    post:
      operationId: changePassword
      tags: [Profile]
      summary: Сменить пароль
      description: >
        current обязателен, кроме случая mustChangePassword = true (первый вход системного администратора с паролем из конфигурации: достаточно next, 204).
        Если пароля нет (вход только через Telegram), задать его нельзя: 422 с fields.current = required.
        Неверный current - 422 с fields.current = invalid; неверные попытки считаются теми же счётчиками, что и вход, при превышении - 429 too_many_attempts.
        Успех отзывает остальные сессии и снимает mustChangePassword. Право: `none` (достаточно сессии).
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile/telegram/start:
    post:
      operationId: startProfileTelegram
      tags: [Profile, Telegram]
      summary: Начать привязку Telegram
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile/telegram:
    delete:
      operationId: unlinkTelegram
      tags: [Profile]
      summary: Отвязать Telegram
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '204':
          description: Отвязан
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile/notifications:
    patch:
      operationId: updateNotificationSettings
      tags: [Profile]
      summary: Включить или выключить уведомления в Telegram
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin users]
      summary: Список пользователей
      description: 'Право: `user-list`.'
      x-permission: user-list
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [invited, deactivated]
      responses:
        '200':
          description: Весь список без пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/invite:
    post:
      operationId: inviteUser
      tags: [Admin users]
      summary: Пригласить пользователя
      description: 'Право: `user-invite`.'
      x-permission: user-invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Пользователь и ссылка-приглашение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/reissue:
    post:
      operationId: reissueUserAccess
      tags: [Admin users]
      summary: Выдать новую ссылку для входа
      description: >
        Отзывает прежние приглашения и сессии, сбрасывает пароль, привязку Telegram и уведомления в Telegram, ставит статус invited.
        Если у пользователя уже есть логин, приглашение kind=reissue (логин сохраняется); если логина ещё нет, kind=new и при принятии нужно выбрать логин.
        Для себя - 409 cannot_reissue_self, для деактивированного - 409 user_deactivated. Право: `user-reissue-access`.
      x-permission: user-reissue-access
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Новая ссылка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/deactivate:
    post:
      operationId: deactivateUser
      tags: [Admin users]
      summary: Деактивировать пользователя
      description: >
        Ставит deactivated, отзывает все сессии и действующие приглашения: по старой ссылке деактивированный не активируется (404 invitation_invalid),
        а незавершённый вход через Telegram даёт статус deactivated. Повторный вызов для деактивированного - 200 без изменений. Право: `user-deactivate`.
      x-permission: user-deactivate
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/activate:
    post:
      operationId: activateUser
      tags: [Admin users]
      summary: Вернуть пользователя
      description: 'Право: `user-deactivate`.'
      x-permission: user-deactivate
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/projects:
    get:
      operationId: listAdminProjects
      tags: [Admin projects]
      summary: Все проекты системы (без содержимого)
      description: 'Порядок по названию. Право: `project-list-all`.'
      x-permission: project-list-all
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Весь список без пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      tags: [Admin projects]
      summary: Создать проект
      description: 'Право: `project-create`.'
      x-permission: project-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Проект создан, owner назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/projects/{id}/members:
    get:
      operationId: listAdminProjectMembers
      tags: [Admin projects]
      summary: Участники проекта (для выбора нового owner)
      description: >
        Весь список без пагинации, включая деактивированных: порядок owner, admin, member, viewer, внутри роли по имени.
        Работает для любого проекта; системному администратору не нужно быть участником.
        Отдаёт только состав участников, содержимого проекта нет. Право: `project-change-owner`.
      x-permission: project-change-owner
      parameters:
        - $ref: '#/components/parameters/ProjectUuid'
      responses:
        '200':
          description: Весь список без пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/projects/{id}/change-owner:
    post:
      operationId: changeProjectOwner
      tags: [Admin projects]
      summary: Сменить owner проекта
      description: 'Новый owner должен быть активным участником (список - GET /admin/projects/{id}/members); прежний становится admin. Единственный путь смены owner. Право: `project-change-owner`.'
      x-permission: project-change-owner
      parameters:
        - $ref: '#/components/parameters/ProjectUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects:
    get:
      operationId: listMyProjects
      tags: [Projects]
      summary: Проекты текущего пользователя
      description: 'Только проекты, где пользователь участник; порядок по названию. Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
