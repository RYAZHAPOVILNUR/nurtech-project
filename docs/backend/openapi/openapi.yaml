      summary: Приём обновлений Telegram (режим webhook)
      description: 'Проверяется заголовок X-Telegram-Bot-Api-Secret-Token; обрабатываются команды /start <token> и нажатия кнопок подтверждения (callback_query). Неверный секрет - 403; в режиме polling ручка выключена - 404. Публичная ручка, сессия не нужна.'
