      tags: [Tasks]
      summary: Сменить статус и позицию карточки
      description: >
        prevId и nextId - соседи, которых пользователь видит на доске в момент переноса: prevId - карточка непосредственно ВЫШЕ, nextId - непосредственно НИЖЕ.
        Карточка встаёт между ними, даже если между этими соседями есть задачи, скрытые фильтром доски, окном Done или архивные: фронт их не передаёт и не знает о них.
        Если соседей нет, карточка встаёт в конец колонки; если передан один сосед, вплотную к нему.
        409 stale_position - если сосед (prevId или nextId) не найден в проекте (в том числе неизвестный UUID), архивирован, находится в другом статусе, чем целевой, или совпадает с переносимой задачей; фронт откатывает карточку и перезапрашивает доску.
        В теле запроса null у prevId и nextId равен отсутствию поля.
        Повтор с теми же соседями при отсутствии изменений на доске всегда успешен.
        reason обязателен, если статус меняется на статус с requiresReason; сохраняется комментарием status_reason.
        Перестановка внутри колонки не меняет updatedAt и историю. Если статус не меняется (в том числе повторный запрос), reason игнорируется (200, комментарий не создаётся).
        Право: `task-move`.
