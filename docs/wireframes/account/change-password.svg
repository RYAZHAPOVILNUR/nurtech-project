ить</text><rect x="600" y="210" width="420" height="52" rx="12" fill="#fff" stroke="#d03a26"/><text x="614" y="227" class="xs" style="">Новый пароль *</text><text x="614" y="247" class="" style="">•••••</text><text x="990" y="244" class="s" style="">👁</text><text x="600" y="278" class="xs" style="fill:#d03a26">Не менее 8 символов, буква и цифра</text><rect x="600" y="296" width="420" height="52" rx="12" fill="#fff" stroke="#d03a26"/><text x="614" y="313" class="xs" style="">Повтор пароля *</text><text x="614" y="333" class="" style="">••••••••</text><text x="990" y="330" class="s" style="">👁</text><text x="600" y="364" class="xs" style="fill:#d03a26">Пароли не совпадают</text><text x="600" y="388" class="xs" style="">Пароль: не менее 8 символов, буква и цифра.</text><rect x="600" y="412" width="420" height="44" rx="22" fill="#526ed3"/><text x="810" y="438" text-anchor="middle" class="" style="fill:#fff;font-weight:700">Сохранить пароль</text><text x="810" y="488" text-anchor="middle" class="lnk" style="">Выйти</text></svg>