font-weight:800">T</text><text x="810.0" y="154" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="810.0" y="190" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Вход</text><rect x="600" y="218" width="420" height="44" rx="12" fill="#fdecea" stroke="#f5b5ae"/><text x="616" y="245" class="" style="fill:#c0392b;font-weight:600">Неверный логин или пароль</text><rect x="600" y="278" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="614" y="295" class="xs" style="">Логин</text><rect x="600" y="346" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="614" y="363" class="xs" style="">Пароль</text><text x="614" y="383" class="" style="">•••••••••</text><text x="990" y="380" class="s" style="">👁</text><rect x="600" y="422" width="420" height="44" rx="22" fill="#526ed3"/><text x="810.0" y="448.0" text-anchor="middle" style="fill:#fff;font-weight:700">Войти</text><line x1="600" y1="492" x2="790.0" y2="492" stroke="#e3e4ec"/><text x="810.0" y="497" class="xs" style="" text-anchor="middle">или</text><line x1="830.0" y1="492" x2="1020" y2="492" stroke="#e3e4ec"/><rect x="600" y="516" width="420" height="44" rx="22" fill="#ececf2"/><text x="810.0" y="542.0" text-anchor="middle" style="fill:#1b1f3b;font-weight:700">✈  Войти через Telegram</text><text x="810.0" y="580" class="xs" style="" text-anchor="middle">Забыли пароль? Обратитесь к системному администратору.</text><rect x="1090" y="50" width="500" height="620" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="1090" y="38" class="cap" style="">3. Аккаунт деактивирован</text><rect x="1320" y="86" width="40" height="40" rx="12" fill="#526ed3"/><text x="1340" y="113" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:800">T</text><text x="1340.0" y="154" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="1340.0" y="190" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Вход</text><rect x="1130" y="218" width="420" height="44" rx="12" fill="#fff6e5" stroke="#ffd9a0"/><text x="1146" y="245" class="" style="fill:#8a5a00;font-weight:600;font-size:11px">Аккаунт деактивирован. Обратитесь к системному администратору.</text><rect x="1130" y="278" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="1144" y="295" class="xs" style="">Логин</text><rect x="1130" y="346" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="1144" y="363" class="xs" style="">Пароль</text><text x="1144" y="383" class="" style="">•••••••••</text><text x="1520" y="380" class="s" style="">👁</text><rect x="1130" y="422" width="420" height="44" rx="22" fill="#526ed3"/><text x="1340.0" y="448.0" text-anchor="middle" style="fill:#fff;font-weight:700">Войти</text><line x1="1130" y1="492" x2="1320.0" y2="492" stroke="#e3e4ec"/><text x="1340.0" y="497" class="xs" style="" text-anchor="middle">или</text><line x1="1360.0" y1="492" x2="1550" y2="492" stroke="#e3e4ec"/><rect x="1130" y="516" width="420" height="44" rx="22" fill="#ececf2"/><text x="1340.0" y="542.0" text-anchor="middle" style="fill:#1b1f3b;font-weight:700">✈  Войти через Telegram</text><text x="1340.0" y="580" class="xs" style="" text-anchor="middle">Забыли пароль? Обратитесь к системному администратору.</text><rect x="30" y="740" width="500" height="620" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="30" y="728" class="cap" style="">4. Вход через Telegram: ждём подтверждения</text><rect x="260" y="780" width="40" height="40" rx="12" fill="#526ed3"/><text x="280" y="807" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:800">T</text><text x="280.0" y="860" class="h" style="font-size:18px" text-anchor="middle">Вход через Telegram</text><circle cx="280.0" cy="950" r="26" fill="none" stroke="#526ed3" stroke-width="4" stroke-dasharray="90 50"/><text x="280.0" y="1020" class="" style="" text-anchor="middle">Откройте Telegram и нажмите Start в боте.</text><text x="280.0" y="1044" class="s" style="" text-anchor="middle">Ждём подтверждения…</text><rect x="90" y="1090" width="380" height="44" rx="22" fill="#526ed3"/><text x="280.0" y="1116.0" text-anchor="middle" style="fill:#fff;font-weight:700">Открыть Telegram снова</text><text x="280.0" y="1170" class="lnk" style="" text-anchor="middle">Отмена</text><text x="280.0" y="1210" class="xs" style="" text-anchor="middle">Запрос действует 5 минут</text><rect x="560" y="740" width="500" height="620" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="560" y="728" class="cap" style="">5. Время ожидания Telegram истекло</text><rect x="790" y="780" width="40" height="40" rx="12" fill="#526ed3"/><text x="810" y="807" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:800">T</text><text x="810.0" y="860" class="h" style="font-size:18px" text-anchor="middle">Вход через Telegram</text><text x="810.0" y="960" class="h" style="font-size:15px" text-anchor="middle">Время ожидания истекло</text><text x="810.0" y="986" class="s" style="" text-anchor="middle">Подтверждение не пришло за 5 минут.</text><rect x="620" y="1040" width="380" height="44" rx="22" fill="#526ed3"/><text x="810.0" y="1066.0" text-anchor="middle" style="fill:#fff;font-weight:700">Попробовать снова</text><text x="810.0" y="1120" class="lnk" style="" text-anchor="middle">Вернуться ко входу</text><rect x="1090" y="740" width="500" height="620" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="1090" y="728" class="cap" style="">6. Telegram не привязан к аккаунту</text><rect x="1320" y="780" width="40" height="40" rx="12" fill="#526ed3"/><text x="1340" y="807" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:800">T</text><text x="1340.0" y="860" class="h" style="font-size:18px" text-anchor="middle">Вход через Telegram</text><text x="1340.0" y="960" class="h" style="font-size:15px" text-anchor="middle">Этот Telegram не привязан ни к одному аккаунту</text><text x="1340.0" y="986" class="s" style="" text-anchor="middle">Войдите по логину и паролю и привяжите Telegram в профиле.</text><rect x="1150" y="1040" width="380" height="44" rx="22" fill="#ececf2"/><text x="1340.0" y="1066.0" text-anchor="middle" style="fill:#1b1f3b;font-weight:700">Вернуться ко входу</text><rect x="30" y="1430" width="500" height="620" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="30" y="1418" class="cap" style="">7. Вход через Telegram: аккаунт деактивирован</text><rect x="260" y="1470" width="40" height="40" rx="12" fill="#526ed3"/><text x="280" y="1497" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:800">T</text><text x="280" y="1550" class="h" style="font-size:18px" text-anchor="middle">Вход через Telegram</text><text x="280" y="1650" class="h" style="font-size:15px" text-anchor="middle">Аккаунт деактивирован</text><text x="280" y="1676" class="s" style="" text-anchor="middle">Обратитесь к системному администратору.</text><rect x="90" y="1730" width="380" height="44" rx="22" fill="#ececf2"/><text x="280" y="1756" text-anchor="middle" style="fill:#1b1f3b;font-weight:700">Вернуться ко входу</text></svg>