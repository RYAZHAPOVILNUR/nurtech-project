аться</text><rect x="1360" y="620" width="190" height="40" rx="20" fill="#ececf2"/><text x="1455" y="644" text-anchor="middle" class="" style="fill:#1b1f3b;font-weight:700">Закрыть без сохранения</text><rect x="1620" y="450" width="500" height="330" rx="20" fill="#fff" stroke="#fff" /><text x="1620" y="438" class="cap" style="">8. Смена статуса на Cancelled / Blocked в карточке: причина</text><text x="1644" y="486" class="h" style="font-size:14px;fill:#6c7088">PROJ-139</text><rect x="1726" y="470" width="52" height="22" rx="11" fill="#eef0fa" stroke="#eef0fa" /><text x="1738" y="486" class="" style="font-size:12px;font-weight:600">Task</text><text x="2084" y="486" class="s" style="font-size:16px">✕</text><rect x="1660" y="520" width="420" height="200" rx="18" fill="#fff" stroke="#cfd1de" /><text x="1684" y="556" class="h" style="font-size:16px">Перевести в Cancelled</text><rect x="1684" y="572" width="372" height="60" rx="12" fill="#fff" stroke="#d03a26" /><text x="1698" y="589" class="xs" style="">Причина *</text><text x="1698" y="609" class="mut" style="">Что произошло</text><text x="1688" y="648" class="" style="fill:#d03a26;font-size:11px">Укажите причину</text><rect x="1684" y="666" width="120" height="40" rx="20" fill="#ececf2"/><text x="1744.0" y="690.0" text-anchor="middle" style="fill:#1b1f3b;font-weight:700">Отмена</text><rect x="1820" y="666" width="120" height="40" rx="20" fill="#526ed3"/><text x="1880.0" y="690.0" text-anchor="middle" style="fill:#fff;font-weight:700">Подтвердить</text><rect x="30" y="880" width="620" height="300" rx="20" fill="#fff" stroke="#fff" /><text x="30" y="868" class="cap" style="">9. Комментарии для admin и owner: у чужого «Ответить» и «Удалить», у своего ещё и «Изменить»</text><text x="54" y="930" class="h" style="font-size:13px">Комментарии  3</text><rect x="52" y="940" width="118" height="3" rx="1.5" fill="#526ed3"/><text x="190" y="930" class="s" style="font-size:13px">Время</text><text x="278" y="930" class="s" style="fon