<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1090" width="1620" height="1090"><style>
text{font-family:Manrope,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1b1f3b}
.s{fill:#6c7088;font-size:12px}.xs{fill:#6c7088;font-size:11px}.h{font-weight:700}.th{font-weight:700;font-size:12px;fill:#6c7088}
.lnk{fill:#526ed3;font-weight:600}.mut{fill:#6c7088}.cap{fill:#526ed3;font-size:12px;font-weight:700}.err{fill:#d03a26;font-size:11px}
