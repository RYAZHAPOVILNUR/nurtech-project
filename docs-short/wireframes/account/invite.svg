<rect width="1620" height="1090" fill="#f6f6f9"/><rect x="30" y="50" width="500" height="640" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="30" y="38" class="cap" style="">1. Приглашение: логин и пароль</text><rect x="260.0" y="86" width="40" height="40" rx="12" fill="#526ed3"/><text x="280.0" y="113" class="" style="fill:#fff;font-size:18px;font-weight:800" text-anchor="middle">T</text><text x="280.0" y="154" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="280.0" y="190" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Приглашение</text><text x="280.0" y="216" class="s" style="" text-anchor="middle">Мария Смирнова, задайте логин и пароль</text><rect x="70" y="236" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="84" y="253" class="xs" style="">Логин *</text><text x="84" y="273" class="" style="">maria_s</text><text x="74" y="304" class="xs" style="">Латиница в нижнем регистре, цифры и _, 3–32 символа</text><rect x="70" y="320" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="84" y="337" class="xs" style="">Пароль *</text><text x="84" y="357" class="" style="">••••••••••</text><text x="460" y="354" class="s" style="">👁</text><text x="74" y="388" class="xs" style="">Не менее 8 символов, буква и цифра</text><rect x="70" y="404" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="84" y="421" class="xs" style="">Повтор пароля *</text><text x="84" y="441" class="" style="">••••••••••</text><text x="460" y="438" class="s" style="">👁</text><rect x="70" y="480" width="420" height="44" rx="22" fill="#526ed3"/><text x="280.0" y="507.0" class="" style="fill:#fff;font-weight:700" text-anchor="middle">Создать аккаунт</text><rect x="560" y="50" width="500" height="640" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="560" y="38" class="cap" style="">2. Ошибки: занятый логин, слабый пароль, повтор не совпадает</text><rect x="790.0" y="86" width="40" height="40" rx="12" fill="#526ed3"/><text x="810.0" y="113" class="" style="fill:#fff;font-size:18px;font-weight:800" text-anchor="middle">T</text><text x="810.0" y="154" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="810.0" y="190" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Приглашение</text><text x="810.0" y="216" class="s" style="" text-anchor="middle">Мария Смирнова, задайте логин и пароль</text><rect x="600" y="236" width="420" height="52" rx="12" fill="#fff" stroke="#e4513a"/><text x="614" y="253" class="xs" style="">Логин *</text><text x="614" y="273" class="" style="">anna_owner</text><text x="604" y="304" class="err" style="">Такой логин уже занят</text><rect x="600" y="320" width="420" height="52" rx="12" fill="#fff" stroke="#e4513a"/><text x="614" y="337" class="xs" style="">Пароль *</text><text x="614" y="357" class="" style="">••••</text><text x="990" y="354" class="s" style="">👁</text><text x="604" y="388" class="err" style="">Не менее 8 символов, буква и цифра</text><rect x="600" y="404" width="420" height="52" rx="12" fill="#fff" stroke="#e4513a"/><text x="614" y="421" class="xs" style="">Повтор пароля *</text><text x="614" y="441" class="" style="">••••••••••</text><text x="990" y="438" class="s" style="">👁</text><text x="604" y="472" class="err" style="">Пароли не совпадают</text><rect x="600" y="496" width="420" height="44" rx="22" fill="#526ed3"/><text x="810.0" y="523.0" class="" style="fill:#fff;font-weight:700" text-anchor="middle">Создать аккаунт</text><rect x="1090" y="50" width="500" height="640" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="1090" y="38" class="cap" style="">3. Новая ссылка вместо забытого пароля: логин не меняется</text><rect x="1320.0" y="86" width="40" height="40" rx="12" fill="#526ed3"/><text x="1340.0" y="113" class="" style="fill:#fff;font-size:18px;font-weight:800" text-anchor="middle">T</text><text x="1340.0" y="154" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="1340.0" y="190" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Приглашение</text><text x="1340.0" y="216" class="s" style="" text-anchor="middle">Мария Смирнова, задайте новый пароль</text><rect x="1130" y="236" width="420" height="52" rx="12" fill="#f8f8fb" stroke="#cfd1de"/><text x="1144" y="253" class="xs" style="">Логин</text><text x="1144" y="273" class="mut" style="">maria_s</text><text x="1520" y="270" class="s" style="">🔒</text><text x="1134" y="304" class="xs" style="">Логин нельзя изменить</text><rect x="1130" y="320" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="1144" y="337" class="xs" style="">Пароль *</text><text x="1144" y="357" class="" style="">••••••••••</text><text x="1520" y="354" class="s" style="">👁</text><text x="1134" y="388" class="xs" style="">Не менее 8 символов, буква и цифра</text><rect x="1130" y="404" width="420" height="52" rx="12" fill="#fff" stroke="#cfd1de"/><text x="1144" y="421" class="xs" style="">Повтор пароля *</text><text x="1144" y="441" class="" style="">••••••••••</text><text x="1520" y="438" class="s" style="">👁</text><rect x="1130" y="480" width="420" height="44" rx="22" fill="#526ed3"/><text x="1340.0" y="507.0" class="" style="fill:#fff;font-weight:700" text-anchor="middle">Сохранить пароль</text><rect x="30" y="750" width="500" height="300" rx="24" fill="#fff" stroke="#e3e4ec"/><text x="30" y="738" class="cap" style="">4. Ссылка недействительна</text><rect x="260.0" y="786" width="40" height="40" rx="12" fill="#526ed3"/><text x="280.0" y="813" class="" style="fill:#fff;font-size:18px;font-weight:800" text-anchor="middle">T</text><text x="280.0" y="854" class="h" style="font-size:18px" text-anchor="middle">Таск-менеджер</text><text x="280.0" y="890" class="" style="font-size:15px;fill:#6c7088" text-anchor="middle">Ссылка недействительна</text><text x="280.0" y="926" class="s" style="" text-anchor="middle">Ссылка уже использована или срок её действия истёк.</text><text x="280.0" y="946" class="s" style="" text-anchor="middle">Попросите новую ссылку у ментора.</text><rect x="160" y="976" width="240" height="44" rx="22" fill="#ececf2"/><text x="280.0" y="1003.0" class="" style="fill:#1b1f3b;font-weight:700" text-anchor="middle">Ко входу</text><text x="560" y="780" class="s" style="">После «Создать аккаунт» вход выполнен: открывается последний проект</text><text x="560" y="800" class="s" style="">или экран «Вас ещё не добавили в проекты».</text><text x="560" y="830" class="s" style="">Занятость логина проверяется при потере фокуса поля «Логин»;</text><text x="560" y="850" class="s" style="">кнопка всегда активна, ошибки — под полями после нажатия.</text></svg>